services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: yesbook
      POSTGRES_PASSWORD: yesbook
      POSTGRES_DB: yesbook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Integration tests truncate their database, so they get their own.
      - ./deploy/local/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yesbook"]
      interval: 2s
      retries: 15

  # Local OCR / layout / figure extraction for Automatic+images (default path).
  # make dev starts this with postgres and sets YESBOOK_DOCLING_URL=http://localhost:5001
  docling:
    image: quay.io/docling-project/docling-serve:latest
    ports:
      - "5001:5001"

volumes:
  pgdata:
