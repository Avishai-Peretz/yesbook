name: yesbook_stuck_jobs
description: Jobs queued or processing without progress for 45 minutes, logged by every scheduled sweep.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="outbox-publisher"
  AND jsonPayload.message="stuck jobs"
valueExtractor: EXTRACT(jsonPayload.count)
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
bucketOptions:
  linearBuckets:
    numFiniteBuckets: 20
    width: 1
    offset: 0
