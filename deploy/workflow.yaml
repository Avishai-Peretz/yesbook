# Processing workflow: one execution per document, started by the Document
# API with {"tenant_id": ..., "job_id": ...}. It owns retries and the
# deadline; the worker enforces the per-document attempt and spend caps and
# resumes from saved evidence on every retry.
main:
  params: [args]
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          - workerJob: ${"projects/" + project + "/locations/" + location + "/jobs/yesbook-worker"}
          - tenantId: ${args.tenant_id}
          - jobId: ${args.job_id}
          # Stable across retries of this execution, so a retried worker can
          # reclaim the job without waiting for the claim lease to expire.
          - workerId: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
    - process:
        try:
          call: googleapis.run.v2.projects.locations.jobs.run
          args:
            name: ${workerJob}
            body:
              overrides:
                taskCount: 1
                timeout: 1800s
                containerOverrides:
                  - args: ${["process", tenantId, jobId, workerId]}
          result: execution
        retry:
          predicate: ${always_retry}
          max_retries: 3
          backoff:
            initial_delay: 30
            max_delay: 300
            multiplier: 2
        except:
          as: e
          steps:
            - block:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${workerJob}
                  body:
                    overrides:
                      taskCount: 1
                      timeout: 300s
                      containerOverrides:
                        - args: ${["block", tenantId, jobId, "processing failed after retries"]}
            - fail:
                raise: ${e}
    - done:
        return:
          job_id: ${jobId}
          execution: ${execution.name}

always_retry:
  params: [e]
  steps:
    - log:
        call: sys.log
        args:
          severity: WARNING
          json:
            message: "worker run failed, retrying"
            error: ${e}
    - retry:
        return: true
